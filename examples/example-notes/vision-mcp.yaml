version: "0.1"
app:
  id: example-notes
  name: Example Notes (macOS)
  platform: macos
  launch_hint: attach_after_launch
  description: 演示在 macOS Real-window Capsule 中创建一条笔记并保存。
visual_box:
  id: notes-capsule-1
  mode: real_window
  platform: macos
  display:
    width_px: 1100
    height_px: 720
    scale: 2.0
    dpi_x: 144
    dpi_y: 144
    refresh_rate_hz: 60
  target_window:
    bundle_id: com.example.notes
    title_regex: ".*Notes.*"
  coordinate_space: normalized_client_rect
  contract:
    require_same_display: true
    require_client_size_px: [1100, 720]
    tolerate_client_size_delta_px: 4
    require_unminimized: true
    require_foreground_for_input: true
    validate_before_each_action: true
  fallbacks:
    - existing_display
states:
  - id: notes.home
    description: Notes 主界面，左侧列表 + 右侧编辑
    kind: page
    anchors:
      - type: accessibility
        role: window
        name_regex: ".*Notes.*"
      - type: ocr_text
        text: New Note
        match: contains
    controls:
      - id: new_note
        role: button
        label: New Note
        action_types: [click]
        locator_priority:
          - type: accessibility
            role: button
            name: New Note
          - type: ocr_text
            text: New Note
          - type: bbox_norm
            value: [0.04, 0.04, 0.10, 0.05]
        visual:
          bbox_norm: [0.04, 0.04, 0.10, 0.05]
          center_norm: [0.09, 0.065]
        postcondition:
          type: state_should_be
          state_id: notes.compose
  - id: notes.compose
    description: 写作页：左侧已选中新笔记，右侧光标在编辑区
    kind: page
    anchors:
      - type: accessibility
        role: textarea
      - type: ocr_text
        text: Today
        match: contains
    controls:
      - id: title
        role: textbox
        label: 标题
        action_types: [type]
        locator_priority:
          - type: accessibility
            role: textbox
            description: Title
          - type: bbox_norm
            value: [0.32, 0.10, 0.55, 0.06]
        visual:
          bbox_norm: [0.32, 0.10, 0.55, 0.06]
      - id: body
        role: textbox
        label: 正文
        action_types: [type]
        locator_priority:
          - type: accessibility
            role: textarea
          - type: bbox_norm
            value: [0.32, 0.18, 0.55, 0.6]
        visual:
          bbox_norm: [0.32, 0.18, 0.55, 0.6]
      - id: save
        role: button
        label: Save
        action_types: [key, click]
        locator_priority:
          - type: accessibility
            role: button
            name: Save
          - type: ocr_text
            text: Save
        visual:
          bbox_norm: [0.84, 0.04, 0.08, 0.05]
        postcondition:
          any:
            - type: text_should_appear
              text: All changes saved
              timeout_ms: 3000
            - type: state_should_be
              state_id: notes.home
        risk_level: safe
transitions:
  - from: notes.home
    action_id: notes.home.new_note
    to: notes.compose
    verify:
      - type: text_appears
        text: Today
  - from: notes.compose
    action_id: notes.compose.save
    to: notes.home
    verify:
      - type: text_appears
        text: All changes saved
        timeout_ms: 3000
workflows:
  - id: create_quick_note
    description: 在 Notes 中创建一条标题 + 正文笔记并保存
    inputs:
      - name: note_title
      - name: note_body
    steps:
      - action_id: notes.home.new_note
      - action_id: notes.compose.title
        params:
          text: "{{note_title}}"
      - action_id: notes.compose.body
        params:
          text: "{{note_body}}"
      - action_id: notes.compose.save
        params:
          combo: Cmd+S
        approval_required: false
    timeout_ms: 60000
repair_policy:
  max_auto_repair_level: 3
  geometry:
    tolerate_client_size_delta_px: 4
    tolerate_origin_change: true
    require_same_dpi: true
  state:
    min_anchor_score: 0.84
    min_ocr_similarity: 0.86
    min_visual_similarity: 0.82
  control_relocation:
    confidence_threshold: 0.9
    max_bbox_shift_norm: 0.1
  destructive_actions:
    auto_repair_before_action: false
    require_user_confirmation: true
safety_policy:
  forbidden_action_categories:
    - payment
    - destructive
    - external_communication
    - permission_change
    - captcha
  require_approval_for_risk_levels:
    - requires_confirmation
    - destructive
  redaction_patterns: []
  allow_cloud_vlm: false
  audit_log_retention_days: 14
input_lease_policy:
  default_lease_ms: 4000
  break_on_user_input: true
  break_hotkey: Esc Esc
  require_revalidate_after_break: true
metadata:
  created_at: 2026-05-26T09:00:00.000Z
  created_by: vision-mcp-design-team
  tags:
    - example
    - macos
    - real-window
  notes: macOS 首发推荐形态：Real-window Capsule。
  builder_version: "0.1"
