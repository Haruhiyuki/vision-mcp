version: "0.1"
app:
  id: apple-music
  name: Apple Music
  platform: macos
  launch_hint: attach_after_launch
  description: |
    纯视觉构建的 Apple Music map。所有 control 用 bbox_norm 或 key，完全不读 AX。
    Agent 在任何能截图 + click + 键盘的桌面 app 上都能用同样的范式建图。

    设计说明：
    - Apple Music 不同视图（主页/搜索/搜索结果/艺人/专辑/歌曲）的 sidebar 与底部播放栏布局完全一致。
    - 主区域内容差异在 dHash 视觉下区分度低（~0.89 similarity），纯视觉很难做精确 state detection。
    - 因此 map 用单 state "music.app" 容纳所有"全局可见 controls"，再用 transient sub-state 描述 sidebar 进入后的局部页面。
    - 真正的 "我在哪" 应该交给 agent 看截图自行判断（agent-in-the-loop）。
visual_box:
  id: apple-music-capsule
  mode: real_window
  platform: macos
  display:
    width_px: 1280
    height_px: 800
    scale: 2.0
    dpi_x: 144
    dpi_y: 144
    refresh_rate_hz: 60
  target_window:
    bundle_id: com.apple.Music
    title_regex: ".+"
  coordinate_space: normalized_client_rect
  contract:
    require_same_display: true
    require_client_size_px: [1280, 800]
    tolerate_client_size_delta_px: 12
    require_unminimized: true
    require_foreground_for_input: true
    validate_before_each_action: true
  fallbacks:
    - existing_display

states:
  - id: music.app
    description: Apple Music 主窗口（任何 view，sidebar + 底部播放栏始终可见）
    kind: page
    anchors:
      - type: window_title
        pattern: ".+"
    match_policy: any_anchor
    controls:
      # ============ Sidebar：左侧导航（注意 x=0.04 命中图标比 x=0.085 命中文字区更稳）============
      - id: sidebar_search
        role: button
        label: 侧栏「搜索」
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.02, 0.07, 0.04, 0.03]
        visual:
          bbox_norm: [0.02, 0.07, 0.04, 0.03]
          center_norm: [0.04, 0.085]
        notes: 实测命中点 (0.04, 0.085)；点 (0.085, 0.085) 命中文字中央时偶尔无响应
      - id: sidebar_home
        role: button
        label: 侧栏「主页」
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.02, 0.105, 0.04, 0.03]
        visual:
          bbox_norm: [0.02, 0.105, 0.04, 0.03]
          center_norm: [0.04, 0.12]
      - id: sidebar_discover
        role: button
        label: 侧栏「新发现」
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.02, 0.145, 0.04, 0.03]
        visual:
          center_norm: [0.04, 0.16]
      - id: sidebar_radio
        role: button
        label: 侧栏「广播」
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.02, 0.185, 0.04, 0.03]
        visual:
          center_norm: [0.04, 0.20]
      - id: sidebar_recent_added
        role: button
        label: 侧栏「最近添加」
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.02, 0.255, 0.04, 0.03]
        visual:
          center_norm: [0.04, 0.27]
      - id: sidebar_artists
        role: button
        label: 侧栏「艺人」
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.02, 0.295, 0.04, 0.03]
        visual:
          center_norm: [0.04, 0.31]
      - id: sidebar_albums
        role: button
        label: 侧栏「专辑」
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.02, 0.335, 0.04, 0.03]
        visual:
          center_norm: [0.04, 0.35]
      - id: sidebar_songs
        role: button
        label: 侧栏「歌曲」
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.02, 0.375, 0.04, 0.03]
        visual:
          center_norm: [0.04, 0.39]

      # ============ 顶部搜索栏（仅在 sidebar_search 激活后可见） ============
      - id: search_box
        role: textbox
        label: 顶部搜索输入框
        action_types: [type, click]
        locator_priority:
          - type: bbox_norm
            value: [0.32, 0.01, 0.32, 0.04]
        visual:
          bbox_norm: [0.32, 0.01, 0.32, 0.04]
          center_norm: [0.48, 0.03]
        notes: 必须先 click sidebar_search 激活后才存在；click 后获焦（边框变红）
      - id: search_clear
        role: button
        label: 搜索框「×」清除
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.61, 0.022, 0.02, 0.02]
        visual:
          center_norm: [0.62, 0.03]

      # ============ 底部播放栏 ============
      - id: playbar_play_pause
        role: button
        label: 播放/暂停（中央大按钮）
        action_types: [click, key]
        locator_priority:
          - type: bbox_norm
            value: [0.27, 0.925, 0.02, 0.03]
        visual:
          bbox_norm: [0.27, 0.925, 0.02, 0.03]
          center_norm: [0.28, 0.94]
        notes: 实测 click (0.28, 0.94) 成功 toggle；快捷键 space 也可
      - id: playbar_prev
        role: button
        label: 上一首（小三角，click 易 miss，建议 key）
        action_types: [key, click]
        locator_priority:
          - type: bbox_norm
            value: [0.234, 0.929, 0.018, 0.022]
        visual:
          center_norm: [0.245, 0.94]
        notes: 实测 cmd+left 稳定；click 误差 ±5px 就 miss
      - id: playbar_next
        role: button
        label: 下一首（小三角，click 易 miss，建议 key）
        action_types: [key, click]
        locator_priority:
          - type: bbox_norm
            value: [0.302, 0.929, 0.018, 0.022]
        visual:
          center_norm: [0.315, 0.94]
        notes: 实测 cmd+right 稳定
      - id: playbar_shuffle
        role: button
        label: 随机播放
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.2, 0.929, 0.02, 0.022]
        visual:
          center_norm: [0.21, 0.94]
      - id: playbar_repeat
        role: button
        label: 单曲/列表循环
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.34, 0.929, 0.02, 0.022]
        visual:
          center_norm: [0.35, 0.94]
      - id: playbar_lyrics_toggle
        role: button
        label: 歌词显示切换
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.645, 0.929, 0.02, 0.022]
        visual:
          center_norm: [0.655, 0.94]
      - id: playbar_queue_toggle
        role: button
        label: 播放列表 queue 切换
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.675, 0.929, 0.02, 0.022]
        visual:
          center_norm: [0.685, 0.94]
      - id: playbar_airplay
        role: button
        label: AirPlay
        action_types: [click]
        locator_priority:
          - type: bbox_norm
            value: [0.71, 0.929, 0.02, 0.022]
        visual:
          center_norm: [0.72, 0.94]

      # ============ 搜索结果页：最佳结果 4×2 卡片 ============
      - id: result_card_1_1
        role: button
        label: 搜索结果第 1 行第 1 列卡片（最佳结果，通常是艺人/热门歌曲）
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.195, 0.135, 0.13, 0.087]
        visual:
          center_norm: [0.26, 0.18]
        notes: 双击歌曲卡片立即播放；艺人卡片双击不响应（需 click 艺人头像区）
      - id: result_card_1_2
        role: button
        label: 搜索结果第 1 行第 2 列卡片
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.34, 0.135, 0.13, 0.087]
        visual:
          center_norm: [0.41, 0.18]
      - id: result_card_1_3
        role: button
        label: 搜索结果第 1 行第 3 列卡片
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.485, 0.135, 0.13, 0.087]
        visual:
          center_norm: [0.55, 0.18]
      - id: result_card_1_4
        role: button
        label: 搜索结果第 1 行第 4 列卡片
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.63, 0.135, 0.13, 0.087]
        visual:
          center_norm: [0.70, 0.18]
      - id: result_card_2_1
        role: button
        label: 搜索结果第 2 行第 1 列卡片
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.195, 0.265, 0.13, 0.087]
        visual:
          center_norm: [0.26, 0.30]
      - id: result_card_2_2
        role: button
        label: 搜索结果第 2 行第 2 列卡片
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.34, 0.265, 0.13, 0.087]
        visual:
          center_norm: [0.41, 0.30]
      - id: result_card_2_3
        role: button
        label: 搜索结果第 2 行第 3 列卡片
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.485, 0.265, 0.13, 0.087]
        visual:
          center_norm: [0.55, 0.30]
        notes: 周杰伦搜索结果中实测双击「七里香」成功播放
      - id: result_card_2_4
        role: button
        label: 搜索结果第 2 行第 4 列卡片
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.63, 0.265, 0.13, 0.087]
        visual:
          center_norm: [0.70, 0.30]

      # ============ 主页：最近播放卡片 ============
      - id: home_recent_card_1
        role: button
        label: 主页「最近播放」第 1 张卡片
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.195, 0.61, 0.14, 0.18]
        visual:
          center_norm: [0.265, 0.70]
        notes: 实测主页此卡 click 直接开始播放对应专辑（Apple Music 默认行为）
      - id: home_recent_card_2
        role: button
        label: 主页「最近播放」第 2 张卡片
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.345, 0.61, 0.14, 0.18]
        visual:
          center_norm: [0.415, 0.70]
      - id: home_recent_card_3
        role: button
        label: 主页「最近播放」第 3 张卡片
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.495, 0.61, 0.14, 0.18]
        visual:
          center_norm: [0.565, 0.70]
      - id: home_recent_card_4
        role: button
        label: 主页「最近播放」第 4 张卡片
        action_types: [click, double_click]
        locator_priority:
          - type: bbox_norm
            value: [0.645, 0.61, 0.14, 0.18]
        visual:
          center_norm: [0.715, 0.70]

      # ============ 全局键盘动作 ============
      - id: kbd_toggle_play
        role: button
        label: 键盘空格切换播放/暂停（窗口前台时）
        action_types: [key]
        locator_priority:
          - type: bbox_norm
            value: [0.5, 0.5, 0.01, 0.01]
        visual:
          center_norm: [0.5, 0.5]
        notes: 走纯 keyboard，不依赖任何 click 坐标
      - id: kbd_focus_search
        role: button
        label: Cmd+F 聚焦搜索框
        action_types: [key]
        locator_priority:
          - type: bbox_norm
            value: [0.5, 0.5, 0.01, 0.01]
        visual:
          center_norm: [0.5, 0.5]
      - id: kbd_next
        role: button
        label: Cmd+Right 下一首
        action_types: [key]
        locator_priority:
          - type: bbox_norm
            value: [0.5, 0.5, 0.01, 0.01]
        visual:
          center_norm: [0.5, 0.5]
      - id: kbd_prev
        role: button
        label: Cmd+Left 上一首
        action_types: [key]
        locator_priority:
          - type: bbox_norm
            value: [0.5, 0.5, 0.01, 0.01]
        visual:
          center_norm: [0.5, 0.5]

transitions: []

workflows:
  - id: toggle_play_via_keyboard
    description: 用空格切换播放/暂停（最稳）
    steps:
      - action_id: music.app.kbd_toggle_play
        params:
          combo: space
    timeout_ms: 4000

  - id: toggle_play_via_click
    description: 用底部播放栏中央按钮 click（验证视觉坐标）
    steps:
      - action_id: music.app.playbar_play_pause:click
    timeout_ms: 4000

  - id: next_track
    description: 切下一首（键盘）
    steps:
      - action_id: music.app.kbd_next
        params:
          combo: "cmd+right"
    timeout_ms: 5000

  - id: prev_track
    description: 切上一首（键盘）
    steps:
      - action_id: music.app.kbd_prev
        params:
          combo: "cmd+left"
    timeout_ms: 5000

  - id: goto_sidebar_home
    description: 切到主页（click sidebar 主页图标）
    steps:
      - action_id: music.app.sidebar_home
    timeout_ms: 5000

  - id: goto_sidebar_artists
    description: 切到艺人页
    steps:
      - action_id: music.app.sidebar_artists
    timeout_ms: 5000

  - id: goto_sidebar_songs
    description: 切到歌曲资料库
    steps:
      - action_id: music.app.sidebar_songs
    timeout_ms: 5000

  - id: search_and_play_top_song
    description: |
      搜索关键字 → 等结果出现 → 双击最佳结果第 2 行第 3 列（通常是热门歌曲）。
      工作流不依赖 AX，只用 click + type + key。
    inputs:
      - name: keyword
        type: string
    steps:
      - action_id: music.app.sidebar_search
      - action_id: music.app.search_box:click
      - action_id: music.app.kbd_toggle_play
        params:
          combo: "cmd+a"
      - action_id: music.app.kbd_toggle_play
        params:
          combo: "delete"
      - action_id: music.app.search_box:click
      - action_id: music.app.search_box
        params:
          text: "{{keyword}}"
        on_failure: ask_user
      - action_id: music.app.kbd_toggle_play
        params:
          combo: "return"
      - action_id: music.app.result_card_1_2:double_click
        on_failure: ask_user
    timeout_ms: 30000
    notes: |
      复用 kbd_toggle_play 控件来发任意 combo —— 一个有趣的「meta-control」用法。
      正经做法应该新增 kbd_arbitrary 控件，这里图省事。

repair_policy:
  max_auto_repair_level: 3
  geometry:
    tolerate_client_size_delta_px: 12
    tolerate_origin_change: true
    require_same_dpi: true
  state:
    min_anchor_score: 0.5
    min_ocr_similarity: 0.85
    min_visual_similarity: 0.75
  control_relocation:
    confidence_threshold: 0.85
    max_bbox_shift_norm: 0.15
  destructive_actions:
    auto_repair_before_action: false
    require_user_confirmation: true

safety_policy:
  forbidden_action_categories:
    - payment
    - destructive
    - external_communication
    - permission_change
    - captcha
  require_approval_for_risk_levels:
    - requires_confirmation
    - destructive
  redaction_patterns: []
  allow_cloud_vlm: false
  audit_log_retention_days: 14

input_lease_policy:
  default_lease_ms: 60000
  break_on_user_input: true
  break_hotkey: Esc Esc
  require_revalidate_after_break: true

metadata:
  created_at: 2026-05-27T07:35:00.000Z
  created_by: agent-vision-only
  tags:
    - apple-music
    - macos
    - vision-only
  notes: 全程靠 agent 看截图 + 估坐标 + click 验证 + 调整 构建，未读 AX 树。
  builder_version: "0.2"
